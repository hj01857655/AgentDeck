[package]
name = "app"
version = "0.1.0"
description = "AgentDeck desktop control plane"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
parking_lot = "0.12.5"
uuid = { version = "1.20.0", features = ["v4"] }
tower = "0.5.3"
tower-http = "0.7.0"
futures = "0.3.32"
bytes = "1.12.0"
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-store = "2.4.3"
toml_edit = "0.25.12"
